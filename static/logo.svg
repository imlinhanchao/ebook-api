<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ebook API Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8f1ff" />
    </linearGradient>
    <linearGradient id="pageRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.24" />
    </filter>
  </defs>

  <!-- Rounded square badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" />
  <rect x="7.5" y="7.5" width="113" height="113" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Subtle bottom book cover / page stack -->
  <path d="M22 86 C22 89.2 24.5 91.6 27.8 92.2 L58 97.2 C61.5 97.8 64 99.6 64 101.8 C64 99.6 66.5 97.8 70 97.2 L100.2 92.2 C103.5 91.6 106 89.2 106 86 L106 80 L22 80 Z"
        fill="#bfdbfe" opacity="0.55" />

  <!-- Open book body -->
  <g filter="url(#bookShadow)">
    <!-- Left page -->
    <path d="M22 40 C22 36.6 24.8 34.1 28.2 34.6 L57.5 39.2 C61.4 39.8 64 43 64 46.8 L64 94.5 C64 91.2 61.3 88.6 57.5 88 L28.2 83.4 C24.8 82.9 22 80.3 22 77 Z"
          fill="url(#pageLeft)" />
    <!-- Right page -->
    <path d="M106 40 C106 36.6 103.2 34.1 99.8 34.6 L70.5 39.2 C66.6 39.8 64 43 64 46.8 L64 94.5 C64 91.2 66.7 88.6 70.5 88 L99.8 83.4 C103.2 82.9 106 80.3 106 77 Z"
          fill="url(#pageRight)" />
    <!-- Center spine shadow line -->
    <line x1="64" y1="44" x2="64" y2="94.5" stroke="#93c5fd" stroke-width="2" />
  </g>

  <!-- Warm bookmark ribbon on top-right page -->
  <path d="M86 36.8 L95 35.4 L95 54 L90.5 50.2 L86 54 Z" fill="url(#ribbonGrad)" />

  <!-- Left page: clean typography lines -->
  <g stroke="#3b82f6" stroke-width="3.4" stroke-linecap="round" opacity="0.52">
    <line x1="32" y1="51" x2="53" y2="54.2" />
    <line x1="32" y1="62" x2="53" y2="65.2" />
    <line x1="32" y1="73" x2="46" y2="75.2" />
  </g>

  <!-- Right page: clean API / stream-download mark -->
  <g stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="84" y1="60" x2="84" y2="75" />
    <polyline points="77.5,69.5 84,76 90.5,69.5" />
    <line x1="76" y1="81" x2="92" y2="78.8" opacity="0.45" />
  </g>
</svg>
